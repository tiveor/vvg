name: CI

on:
  push:
    branches: [master]
  pull_request:

# The token can only read: CI never writes to the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CLI smoke test
        run: node dist/cli.js "ci" -o ci.svg && node dist/cli.js "ci" -o ci.png
      - name: PNG CLI package smoke test
        run: |
          tgz="$RUNNER_TEMP/$(npm pack ./cli --pack-destination "$RUNNER_TEMP" | tail -1)"
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npx -y --package="$tgz" vvg-cli "ci" -z avatar
          test -s ci.png
