name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: CLI smoke test
        run: node dist/cli.js "ci" -o ci.svg && node dist/cli.js "ci" -o ci.png
      - name: PNG CLI package smoke test
        run: |
          tgz="$RUNNER_TEMP/$(npm pack ./cli --pack-destination "$RUNNER_TEMP" | tail -1)"
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npx -y --package="$tgz" vvg-cli "ci" -z avatar
          test -s ci.png
