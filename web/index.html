<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vvg — every word is a painting</title>
    <meta name="description" content="Type any word and get a one-of-a-kind painting. Same word, same painting, forever. Free, open source, zero dependencies." />
    <meta property="og:title" content="vvg — every word is a painting" />
    <meta property="og:description" content="Type your name. Get your painting." />
    <meta property="og:image" content="https://alvarotech.dev/vvg/og.jpg" />
    <meta property="og:url" content="https://alvarotech.dev/vvg/" />
    <link rel="canonical" href="https://alvarotech.dev/vvg/" />
    <script src="./redirect.js"></script>
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M0 0h32v32H0z' fill='%23ede4d3'/%3E%3Cpath d='M0 0a16 16 0 0 1 16 16H0z' fill='%23e63946'/%3E%3Cpath d='M16 32a16 16 0 0 1 16-16v16z' fill='%231d3557'/%3E%3Ccircle cx='24' cy='8' r='5' fill='%23e9c46a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --wall: #d9d4cb;
        --text: #23201c;
        --font: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        /* Derived here, not on :root, so they follow --text when a painting changes it. */
        --soft: color-mix(in srgb, var(--text) 62%, transparent);
        --line: color-mix(in srgb, var(--text) 18%, transparent);
        min-height: 100svh;
        background: var(--wall);
        color: var(--text);
        font: 400 16px/1.5 var(--font);
        transition: background-color 700ms ease, color 700ms ease;
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: minmax(0, 1fr);
      }
      a { color: inherit; }
      :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 2px; }

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 20px clamp(16px, 4vw, 48px);
      }
      .mark { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; text-decoration: none; }
      .mark span { font-weight: 300; color: var(--soft); margin-left: 8px; font-size: 15px; letter-spacing: 0; }
      header nav { display: flex; gap: 20px; font-size: 15px; }
      header nav a { text-decoration: none; color: var(--soft); }
      header nav a:hover { color: var(--text); }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: 8px clamp(16px, 4vw, 48px) 0;
      }
      .piece { width: min(100%, var(--piece-w, 1100px)); min-width: 0; }
      .canvas-wrap {
        position: relative;
        aspect-ratio: var(--ratio, 1.6);
        width: 100%;
        /* A hung canvas: soft contact shadow plus a long falloff. */
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.18),
          0 18px 40px -12px rgb(0 0 0 / 0.35),
          0 50px 90px -30px rgb(0 0 0 / 0.3);
        cursor: pointer;
        background: color-mix(in srgb, var(--wall) 80%, white);
      }
      canvas { display: block; width: 100%; height: 100%; }

      .label {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px 32px;
        align-items: end;
        margin-top: clamp(20px, 4vh, 36px);
      }
      .title {
        font: 600 clamp(32px, 6vw, 72px) / 1 var(--font);
        font-variation-settings: "opsz" 96;
        letter-spacing: -0.035em;
        color: var(--text);
        background: none;
        border: 0;
        border-bottom: 1px solid transparent;
        padding: 0 0 4px;
        width: 100%;
        min-width: 0;
        transition: border-color 200ms;
      }
      .title:hover, .title:focus { border-bottom-color: var(--line); outline: none; }
      .title::placeholder { color: var(--soft); }
      .meta { margin: 6px 0 0; color: var(--soft); font-size: 15px; }
      .meta select {
        font: inherit;
        color: var(--text);
        background: none;
        border: 0;
        border-bottom: 1px dotted var(--soft);
        padding: 0 2px;
        cursor: pointer;
        appearance: none;
      }
      .meta select option { color: #222; }

      .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      button {
        font: 500 15px/1 var(--font);
        color: var(--text);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 11px 18px;
        cursor: pointer;
        transition: background-color 150ms, border-color 150ms;
      }
      button:hover { border-color: var(--soft); }
      button.primary { background: var(--text); color: var(--wall); border-color: var(--text); }
      button.primary:hover { opacity: 0.88; }

      .code {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 8px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        font-size: 14px;
        color: var(--soft);
        min-width: 0;
      }
      .code span { flex: none; }
      .code code {
        min-width: 0;
        flex: 1;
        font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        color: var(--text);
        overflow-x: auto;
        white-space: nowrap;
      }
      .code button { padding: 6px 12px; font-size: 13px; flex: none; }

      footer {
        padding: 28px clamp(16px, 4vw, 48px) 24px;
        color: var(--soft);
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      footer span { min-width: 0; }
      kbd {
        font: 12px ui-monospace, Menlo, monospace;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        translate: -50% 12px;
        opacity: 0;
        background: var(--text);
        color: var(--wall);
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 14px;
        pointer-events: none;
        transition: opacity 200ms, translate 200ms;
      }
      .toast.show { opacity: 1; translate: -50% 0; }

      @media (max-width: 720px) {
        .label { grid-template-columns: minmax(0, 1fr); }
        .code span { display: none; }
        .actions { justify-content: flex-start; }
        header nav a.hide-sm { display: none; }
      }
      /* Portrait and square paintings hang with the label beside them, as in a
         gallery: under a narrow painting the label has no room. */
      @media (min-width: 900px) {
        .piece.side {
          width: auto;
          max-width: 100%;
          display: grid;
          grid-template-columns: auto 440px;
          gap: 56px;
          align-items: end;
        }
        .piece.side .canvas-wrap { width: min(calc(74svh * var(--ratio)), calc(100vw - 600px)); }
        .piece.side .label { grid-template-columns: minmax(0, 1fr); margin-top: 0; }
        .piece.side .title { font-size: clamp(32px, 4vw, 56px); }
        .piece.side .actions { justify-content: flex-start; gap: 6px; }
        .piece.side .actions button { padding: 10px 14px; font-size: 14px; }
        .piece.side .code { flex-wrap: wrap; }
        .piece.side .code code { flex-basis: 100%; white-space: normal; overflow-wrap: anywhere; }
      }
      /* On narrow screens the label takes the full width under the painting. */
      @media (max-width: 899px) {
        .piece.side { width: 100%; }
        .piece.side .canvas-wrap { width: min(100%, calc(68svh * var(--ratio))); margin-inline: auto; }
      }
      @media (prefers-reduced-motion: reduce) {
        body, .title, .toast { transition: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="./">vvg<span>every word is a painting</span></a>
      <nav>
        <a class="hide-sm" href="https://www.npmjs.com/package/@tiveor/vvg">npm</a>
        <a href="https://github.com/tiveor/vvg">GitHub</a>
      </nav>
    </header>

    <main>
      <article class="piece">
        <div class="canvas-wrap" id="wrap" title="Click for a new painting">
          <canvas id="art" aria-label="Generated painting"></canvas>
        </div>

        <div class="label">
          <div>
            <input class="title" id="seed" maxlength="80" spellcheck="false" autocomplete="off"
              placeholder="Type your name" aria-label="Title of the painting, also its seed" />
            <p class="meta">
              <select id="style" aria-label="Style"></select>,
              <select id="palette" aria-label="Palette"></select> palette,
              <select id="size" aria-label="Format"></select>
            </p>
          </div>
          <div class="actions">
            <button id="again" class="primary">New painting</button>
            <button id="png">Download PNG</button>
            <button id="svg">SVG</button>
            <button id="share">Copy link</button>
          </div>
          <div class="code">
            <span>Paint it from your terminal</span>
            <code id="cmd"></code>
            <button id="copy-cmd">Copy</button>
          </div>
        </div>
      </article>
    </main>

    <footer>
      <span>Same word, same painting, on every device. <kbd>Space</kbd> for a new one, <kbd>←</kbd> <kbd>→</kbd> to go back, <kbd>S</kbd> to save.</span>
      <span>Open source, MIT. Made in Bolivia by <a href="https://github.com/tiveor">Alvaro Orellana</a></span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
